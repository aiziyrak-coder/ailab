# Nginx: faqat AILab uchun alohida fayl (mavjud saytlarga tegmang).
# sudo cp nginx-ailab.conf /etc/nginx/sites-available/ailab-ziyrak
# sudo ln -sf /etc/nginx/sites-available/ailab-ziyrak /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# Keyin: sudo certbot --nginx -d ailab.ziyrak.org -d ailabapi.ziyrak.org

upstream ailab_gunicorn {
    server 127.0.0.1:8010;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name ailab.ziyrak.org;

    client_max_body_size 220M;

    location / {
        proxy_pass http://ailab_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ailabapi.ziyrak.org;

    client_max_body_size 220M;

    location / {
        proxy_pass http://ailab_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }
}
