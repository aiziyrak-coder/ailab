# Faqat lab.fermi.uz — boshqa nginx saytlarga tegilmasin.
# Server: /etc/nginx/sites-available/lab.fermi.uz.conf
# ln -sf .../lab.fermi.uz.conf /etc/nginx/sites-enabled/lab.fermi.uz.conf
# nginx -t && systemctl reload nginx

upstream lab_fermi_gunicorn {
    server 127.0.0.1:8011;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name lab.fermi.uz;

    client_max_body_size 220M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location = /api/health {
        proxy_pass http://lab_fermi_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }

    location /video_feed {
        proxy_pass http://lab_fermi_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://lab_fermi_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
