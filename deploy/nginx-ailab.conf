# Nginx: faqat AILab uchun alohida fayl — boshqa loyihalarga tegmang.
# sudo cp nginx-ailab.conf /etc/nginx/sites-available/ailab-ziyrak
# sudo ln -sf /etc/nginx/sites-available/ailab-ziyrak /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# ─── HTTPS (Let's Encrypt) — boshqa dasturlarga ta'sir qilmasligi ─────────────
# Certbot faqat siz ko'rsatgan -d domenlari uchun server bloklarini yangilaydi.
# saxar, medora, boshqa server_name — ULARGA tegmaydi, agar:
#   1) certbot buyrug'ida FAQAT ailab.ziyrak.org va ailabapi.ziyrak.org bo'lsa;
#   2) AILab alohida faylda bo'lsa (ushbu fayl → faqat /etc/nginx/sites-available/ailab-ziyrak).
#
# Tavsiya (sertifikat nomi ajratilgan, qayta yangilash aniq):
#   sudo certbot --nginx \
#     -d ailab.ziyrak.org -d ailabapi.ziyrak.org \
#     --cert-name ailab.ziyrak.org --redirect
#
# Yoki lokal mashinadan: python scripts/issue_ailab_https_cert.py (AILAB_SSH_PASSWORD)
#
# Tekshiruv: sudo certbot certificates | grep -A3 ailab.ziyrak.org
# Muammo bo'lsa: sudo certbot renew --cert-name ailab.ziyrak.org --dry-run
#
# Agar brauzerda "Access Temporarily Unavailable" va `1pctl user-info` yozuvi chiqsa —
# bu 1Panel; Django/Ailab emas. ailab.ziyrak.org trafiki 1Panel ga tushyapti yoki 1Panel
# xavfsiz kirish rejimida. SSH: `1pctl user-info` (panel URL ni olish), keyin 1Panel da
# ushbu domen uchun reverse proxy yo'q/qayta sozlang YOKI nginx da ailab-ziyrak boshqa
# saytlardan MUSTAQIL va 127.0.0.1:8011 (gunicorn) ga yo'naltirilganini tekshiring.
#
# 1Panel + certbot: `certbot --nginx -d ailab...` ba'zan sertifikatni
# /etc/nginx/conf.d/1panel.conf ichiga yozadi (boshqa vhostlarga tegmaydi). Keyin ham
# domen 8011 ga borishi uchun 1Panel "sayt" sozlamasini tekshiring.
#
# TEZ-TEZ XATO: certbot yozgan blokda `proxy_pass http://127.0.0.1:18888` qolsa —
# ailab.ziyrak.org 1Panel sahifasini ko'rsatadi ("Access Temporarily Unavailable").
# Avtomatik tuzatish (faqat proxy_pass 18888→8011; nginx -t xato bo'lsa qaytaradi):
#   sudo python3 /opt/ailab/scripts/fix_ailab_nginx_proxy_to_8011.py && sudo systemctl reload nginx
# Agar konfig allaqachon buzilgan bo'lsa, ilgari yaratilgan .bak fayldan tiklang, keyin skriptni qayta ishlating.
# default_server (server_name _) dagi 18888 o'zgarmaydi.

upstream ailab_gunicorn {
    server 127.0.0.1:8011;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name ailab.ziyrak.org;

    client_max_body_size 220M;

    location / {
        proxy_pass http://ailab_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ailabapi.ziyrak.org;

    client_max_body_size 220M;

    location / {
        proxy_pass http://ailab_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }
}
