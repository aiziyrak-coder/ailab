# Nginx: faqat AILab uchun alohida fayl — boshqa loyihalarga tegmang.
# sudo cp nginx-ailab.conf /etc/nginx/sites-available/ailab-ziyrak
# sudo ln -sf /etc/nginx/sites-available/ailab-ziyrak /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# ─── HTTPS (Let's Encrypt) — boshqa dasturlarga ta'sir qilmasligi ─────────────
# Certbot faqat siz ko'rsatgan -d domenlari uchun server bloklarini yangilaydi.
# saxar, medora, boshqa server_name — ULARGA tegmaydi, agar:
#   1) certbot buyrug'ida FAQAT ailab.ziyrak.org va ailabapi.ziyrak.org bo'lsa;
#   2) AILab alohida faylda bo'lsa (ushbu fayl → faqat /etc/nginx/sites-available/ailab-ziyrak).
#
# Tavsiya (sertifikat nomi ajratilgan, qayta yangilash aniq):
#   sudo certbot --nginx \
#     -d ailab.ziyrak.org -d ailabapi.ziyrak.org \
#     --cert-name ailab.ziyrak.org --redirect
#
# Yoki lokal mashinadan: python scripts/issue_ailab_https_cert.py (AILAB_SSH_PASSWORD)
#
# Tekshiruv: sudo certbot certificates | grep -A3 ailab.ziyrak.org
# Muammo bo'lsa: sudo certbot renew --cert-name ailab.ziyrak.org --dry-run

upstream ailab_gunicorn {
    server 127.0.0.1:8011;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name ailab.ziyrak.org;

    client_max_body_size 220M;

    location / {
        proxy_pass http://ailab_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ailabapi.ziyrak.org;

    client_max_body_size 220M;

    location / {
        proxy_pass http://ailab_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }
}
