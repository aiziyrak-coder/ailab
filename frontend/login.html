<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c2a15c">
  <title>Kirish — DermaPATH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="/static/css/style.css?v=r3">
  <link rel="stylesheet" href="/static/css/lab-pro.css?v=r3">
  <link rel="stylesheet" href="/static/css/mobile.css?v=r3">
  <link rel="stylesheet" href="/static/css/brand.css?v=r3">
  <script>window.__MEDLAB_API_BASE__ = "{{ medlab_api_base|default:''|escapejs }}";</script>
</head>
<body class="auth-page-body">
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
  <symbol id="icon-microscope" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21h10"/>
    <path d="M7 21V15h5l2 6"/>
    <path d="M8.5 15V8.5"/>
    <path d="M6 12.5h9"/>
    <circle cx="15.2" cy="7.2" r="2.6"/>
    <path d="M15.2 4.6V3.4a1.4 1.4 0 0 1 2.8 0V4.6"/>
    <path d="M13.1 9.1 9.2 12.2"/>
  </symbol>
</svg>

<div class="auth-page">
  <section class="auth-card" aria-labelledby="authTitle">
    <div class="auth-brandbox">
      <img class="auth-logo" src="/static/img/radeski-logo.png"
           alt="Radeski Skin Clinic" width="262" height="81">
      <h1>Derma<span class="brand-path">PATH</span></h1>
      <span class="brand-slogan">Gistopatologiya platformasi</span>
    </div>
    <h2 id="authTitle">Kirish</h2>
    <p class="auth-sub">Login va parolni yozing</p>
    <form id="loginForm" autocomplete="username">
      <div class="auth-field">
        <label for="username">Login</label>
        <input id="username" name="username" type="text" required maxlength="150" placeholder="Login" autocapitalize="off" spellcheck="false" autocomplete="username">
      </div>
      <div class="auth-field">
        <label for="password">Parol</label>
        <input id="password" name="password" type="password" required maxlength="128" placeholder="Parol" autocomplete="current-password">
      </div>
      <div class="auth-actions">
        <button type="submit" class="auth-btn" id="submitBtn">Kirish</button>
      </div>
    </form>
    <p class="auth-msg" id="msg"></p>
  </section>
</div>

<script src="/static/js/auth.js"></script>
<script>
(function() {
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  function show(text, ok) {
    msg.textContent = text || '';
    msg.className = 'auth-msg' + (ok ? ' ok' : text ? ' err' : '');
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) { show('Login va parol kiriting', false); return; }
    btn.disabled = true;
    var prev = btn.textContent;
    btn.textContent = 'Tekshirilmoqda...';
    show('');
    try {
      if (typeof ensureCsrfCookie === 'function') await ensureCsrfCookie();
      const r = await fetch(apiPath('/api/auth/login'), {
        ...apiFetchInit('POST', { username, password }),
      });
      const data = await r.json().catch(function() { return {}; });
      if (r.ok && data.success) {
        show('Kirish muvaffaqiyatli', true);
        var next = new URLSearchParams(location.search).get('next');
        var dest = (next && next.startsWith('/') && !next.startsWith('//')) ? next : '/';
        window.location.href = dest;
        return;
      }
      if (r.status === 403) {
        show(data.message || 'Sahifani yangilang (F5) va qayta urining', false);
      } else {
        show(data.message || data.detail || 'Login yoki parol noto‘g‘ri', false);
      }
    } catch (err) {
      show("Server bilan aloqa yo'q", false);
    }
    btn.disabled = false;
    btn.textContent = prev || 'Kirish';
  });
})();
</script>
</body>
</html>
