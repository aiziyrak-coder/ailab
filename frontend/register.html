<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1628">
  <title>Ro'yxatdan o'tish — MedLab AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" type="image/png">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>window.__MEDLAB_API_BASE__ = "{{ medlab_api_base|default:''|escapejs }}";</script>
</head>
<body class="auth-page-body">
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
  <symbol id="icon-microscope" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 2v3M12 19v3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M2 12h3M19 12h3"/>
  </symbol>
</svg>

<div class="auth-page">
  <div class="auth-card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <svg width="28" height="28" aria-hidden="true" style="opacity:.9"><use href="#icon-microscope"/></svg>
      <h1 style="margin:0">Yangi hisob</h1>
    </div>
    <p class="auth-sub">MedLab AI laboratoriya tizimiga ro'yxatdan o'ting</p>

    <form id="regForm">
      <div class="auth-field">
        <label for="username">Login</label>
        <input id="username" name="username" type="text" required maxlength="150" placeholder="tanlang" autocapitalize="off" spellcheck="false" autocomplete="username">
      </div>
      <div class="auth-field">
        <label for="viloyatSelect">Viloyat</label>
        <select id="viloyatSelect" name="viloyat" required aria-label="Viloyat"></select>
      </div>
      <div class="auth-field">
        <label for="localitySelect">Tuman yoki shahar</label>
        <select id="localitySelect" name="locality" required aria-label="Tuman yoki shahar"></select>
        <input type="text" id="hududCustom" name="hudud_custom" class="auth-hudud-custom" maxlength="16" placeholder="Kodni qoʻlda kiriting (2–16 harf yoki raqam)" autocapitalize="characters" autocomplete="off" aria-label="Qo‘lda hudud kodi">
      </div>
      <div class="auth-field">
        <label for="clinicNo">Poliklinika № (daftar)</label>
        <input id="clinicNo" name="clinic_no" type="text" inputmode="numeric" maxlength="3" required value="7" placeholder="masalan 7" pattern="[0-9]{1,3}" title="1 dan 3 tagacha raqam" autocomplete="off">
      </div>
      <div class="auth-field">
        <label for="visitTypeSelect">Tur</label>
        <select id="visitTypeSelect" name="visit_type">
          <option value="OP" selected>OP — Oylaviy poliklinika</option>
        </select>
      </div>
      <div class="auth-field">
        <label for="email">Email (ixtiyoriy)</label>
        <input id="email" name="email" type="email" maxlength="254" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="password">Parol (kamida 8 belgi)</label>
        <input id="password" name="password" type="password" required minlength="8" maxlength="128" placeholder="••••••••" autocomplete="new-password">
      </div>
      <div class="auth-field">
        <label for="password2">Parolni tasdiqlang</label>
        <input id="password2" name="password2" type="password" required minlength="8" maxlength="128" placeholder="••••••••" autocomplete="new-password">
      </div>
      <div class="auth-actions">
        <button type="submit" class="auth-btn" id="submitBtn">Ro'yxatdan o'tish</button>
      </div>
    </form>

    <p class="auth-msg" id="msg"></p>
    <p class="auth-link">Allaqachon hisob bormi? <a href="/login">Kirish</a></p>
  </div>
</div>

<script src="/static/js/uz_localities.js"></script>
<script src="/static/js/auth.js"></script>
<script>
(function() {
  const form = document.getElementById('regForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  const locApi = window.MEDLAB_UZ_LOCALITIES;

  function show(text, ok) {
    msg.textContent = text || '';
    msg.className = 'auth-msg' + (ok ? ' ok' : text ? ' err' : '');
  }

  const viloyatSel = document.getElementById('viloyatSelect');
  const localitySel = document.getElementById('localitySelect');
  const hududCustom = document.getElementById('hududCustom');

  function normalizeHududCode(raw) {
    return String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);
  }

  function fillViloyat() {
    viloyatSel.innerHTML = '';
    locApi.getTopLevel().forEach(function(r) {
      var o = document.createElement('option');
      o.value = r.key;
      o.textContent = r.label;
      viloyatSel.appendChild(o);
    });
    viloyatSel.value = locApi.DEFAULT_REGION_KEY;
  }

  function fillLocality(regionKey) {
    localitySel.innerHTML = '';
    var reg = locApi.findRegion(regionKey);
    if (!reg || !reg.places) return;
    reg.places.forEach(function(p) {
      var o = document.createElement('option');
      o.value = p.code;
      o.textContent = p.name + ' · ' + p.code;
      localitySel.appendChild(o);
    });
    var oC = document.createElement('option');
    oC.value = '__custom__';
    oC.textContent = 'Boshqa — kodni qoʻlda kiriting';
    localitySel.appendChild(oC);
    var want = regionKey === locApi.DEFAULT_REGION_KEY ? locApi.DEFAULT_PLACE_CODE : '';
    var ok = false;
    if (want) {
      for (var i = 0; i < localitySel.options.length; i++) {
        if (localitySel.options[i].value === want) {
          localitySel.selectedIndex = i;
          ok = true;
          break;
        }
      }
    }
    if (!ok) localitySel.selectedIndex = 0;
  }

  function getHududCodeForSubmit() {
    if (localitySel.value === '__custom__') return normalizeHududCode(hududCustom.value);
    return normalizeHududCode(localitySel.value);
  }

  function syncHududCustomVisibility() {
    var show = localitySel.value === '__custom__';
    hududCustom.classList.toggle('visible', show);
    hududCustom.required = show;
    hududCustom.setAttribute('aria-hidden', show ? 'false' : 'true');
  }

  viloyatSel.addEventListener('change', function() {
    fillLocality(viloyatSel.value);
    syncHududCustomVisibility();
  });
  localitySel.addEventListener('change', syncHududCustomVisibility);

  fillViloyat();
  fillLocality(locApi.DEFAULT_REGION_KEY);
  syncHududCustomVisibility();

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const password_confirm = document.getElementById('password2').value;
    const hudud_code = getHududCodeForSubmit();
    const clinicRaw = document.getElementById('clinicNo').value.trim();
    const clinicDigits = clinicRaw.replace(/\D/g, '');
    const visit_type = document.getElementById('visitTypeSelect').value.trim().toUpperCase() || 'OP';
    if (!viloyatSel.value || !localitySel.value) { show('Viloyat va tuman/shaharni tanlang', false); return; }
    if (localitySel.value === '__custom__' && (hudud_code.length < 2 || hudud_code.length > 16)) {
      show('Hudud kodi 2 dan 16 tagacha harf yoki raqam bo‘lishi kerak', false);
      return;
    }
    if (!clinicDigits || clinicDigits.length > 3) {
      show('Poliklinika raqami 1 dan 3 tagacha raqam bo‘lishi kerak', false);
      return;
    }
    if (password !== password_confirm) { show('Parollar mos kelmaydi', false); return; }
    if (password.length < 8) { show('Parol kamida 8 belgi', false); return; }
    btn.disabled = true;
    show('');
    try {
      const r = await fetch(apiPath('/api/auth/register'), {
        ...apiFetchInit('POST', {
          username,
          email,
          hudud_code,
          clinic_no: clinicDigits,
          visit_type,
          password,
          password_confirm,
        }),
      });
      const data = await r.json().catch(function() { return {}; });
      if (r.ok && data.success) {
        show('Hisob yaratildi', true);
        window.location.href = '/';
        return;
      }
      var m = data.message || '';
      if (data.errors) {
        try {
          var parts = [];
          for (var k in data.errors) {
            var v = data.errors[k];
            parts.push(k + ': ' + (Array.isArray(v) ? v.join(', ') : v));
          }
          if (parts.length) m = parts.join(' ');
        } catch (_) {}
      }
      show(m || data.detail || 'Xato', false);
    } catch (err) {
      show("Server bilan aloqa yo'q", false);
    }
    btn.disabled = false;
  });
})();
</script>
</body>
</html>
